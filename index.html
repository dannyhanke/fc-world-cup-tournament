// ─── GROUP BUILDER (optimized) ────────────────────────────────────
// Builds 12 groups of 3 satisfying the hard rules — 3 different players
// per group, at most one top-3 player per group, and at most one elite
// (tier-1) nation per group — then optimizes across many candidates.
// Team identity is otherwise just a label: balance and fairness are based
// on PLAYER strength (seed). Goals: (1) even player strength in every
// group, (2) likely group-winners not stacked on one player (reduces
// same-player knockout meetings). Returns null if impossible.
function buildFairGroups(selectedTeams) {
  const shuffle = (arr) => { const a = [...arr]; for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
  const skill = t => -t.playerIdx;                     // higher = stronger player (seed 1 is strongest)
  const meanGroupSkill = selectedTeams.reduce((s, t) => s + skill(t), 0) / 12;
  const groupSkill = g => g.reduce((s, t) => s + skill(t), 0);
  const QUAL_WEIGHT = [1.0, 0.5, 0.15];                // approx advance odds by player-strength rank in the group

  // Build one arrangement that satisfies the hard constraints, biased to even out player strength.
  const tryBuild = () => {
    const teams = shuffle(selectedTeams);
    const groups = Array.from({ length: 12 }, () => []);
    for (const team of teams) {
      const isTop = team.playerIdx < 3;
      const valid = groups
        .map((g, i) => ({ g, i }))
        .filter(({ g }) =>
          g.length < 3 &&
          !g.some(t => t.playerIdx === team.playerIdx) &&
          !(isTop && g.some(t => t.playerIdx < 3)) &&
          !(team.tier === 1 && g.some(t => t.tier === 1)));
      if (valid.length === 0) return null;
      // fill emptier groups first, then steer toward the weaker group (by player strength)
      valid.sort((a, b) => (a.g.length - b.g.length) || (groupSkill(a.g) - groupSkill(b.g)) || (Math.random() - 0.5));
      groups[valid[0].i].push(team);
    }
    return groups.every(g => g.length === 3) ? groups : null;
  };

  // Lower score = better arrangement.
  const score = (groups) => {
    let balance = 0;       // 1) variance of total player strength across groups
    for (const g of groups) { const p = groupSkill(g); balance += (p - meanGroupSkill) ** 2; }
    const expQual = {};    // 2) discourage stacking likely group-winners on one player
    for (const g of groups) {
      const ranked = [...g].sort((a, b) => skill(b) - skill(a));
      ranked.forEach((t, r) => { expQual[t.playerIdx] = (expQual[t.playerIdx] || 0) + (QUAL_WEIGHT[r] || 0); });
    }
    let stacking = 0;
    for (const k in expQual) stacking += expQual[k] ** 2;
    return 2 * balance + 5 * stacking;
  };

  // Generate many valid candidates, keep the best-scoring one.
  let best = null, bestScore = Infinity;
  for (let attempt = 0; attempt < 500; attempt++) {
    const g = tryBuild();
    if (!g) continue;
    const s = score(g);
    if (s < bestScore) { bestScore = s; best = g; }
  }
  if (!best) return null;
  const result = {};
  best.forEach((g, i) => { result[GROUP_LETTERS[i]] = g; });
  return result;
}

// ─── KNOCKOUT SEEDING ─────────────────────────────────────────────
// Place the 16 qualified teams into the bracket so that two teams from
// the SAME player are kept as far apart as possible — never in the same
// R16 match, then not the same quarter, then not the same half. This
// stops one player meeting themselves before the final.
function seedKnockout(advancedTeams) {
  const teams = [...advancedTeams];
  const counts = {};
  teams.forEach(t => { counts[t.playerIdx] = (counts[t.playerIdx] || 0) + 1; });
  // Place "crowded" players first so they get spread out
  teams.sort((a, b) => (counts[b.playerIdx] - counts[a.playerIdx]) || (a.groupPos - b.groupPos));
  const slots = Array(16).fill(null);
  const placed = [];
  const cost = (pos, playerIdx) => {
    let c = 0;
    for (const pl of placed) {
      if (pl.playerIdx !== playerIdx) continue;
      if (Math.floor(pl.pos / 2) === Math.floor(pos / 2)) c += 1000;      // same R16 match
      else if (Math.floor(pl.pos / 4) === Math.floor(pos / 4)) c += 100;  // same quarter
      else if (Math.floor(pl.pos / 8) === Math.floor(pos / 8)) c += 10;   // same half
    }
    return c;
  };
  for (const team of teams) {
    let best = -1, bestCost = Infinity;
    for (let pos = 0; pos < 16; pos++) {
      if (slots[pos]) continue;
      const c = cost(pos, team.playerIdx);
      if (c < bestCost) { bestCost = c; best = pos; }
    }
    slots[best] = team;
    placed.push({ pos: best, playerIdx: team.playerIdx });
  }
  const r16 = [];
  for (let m = 0; m < 8; m++) r16.push([slots[2 * m], slots[2 * m + 1] || null]);
  return r16;
}

// ─── FIXED WC-STYLE BRACKET (Real Groups mode) ────────────────────
// 6 winner-vs-winner R16 matches + 2 runner-up-vs-runner-up matches.
// Group winners have fixed slots; the 4 best runners-up fill the rest.
const WINNER_SLOT = { A: 0, B: 1, C: 2, D: 3, E: 4, F: 5, G: 8, H: 9, I: 10, J: 11, K: 12, L: 13 };
const RUNNERUP_SLOTS = [6, 14, 7, 15];                  // filled best→worst
// Two group winners share an R16 match → their groups are "linked" (a player
// may not own teams in both, or they could meet themselves in the R16).
const BRACKET_PAIRS = [["A", "B"], ["C", "D"], ["E", "F"], ["G", "H"], ["I", "J"], ["K", "L"]];
const GROUP_PARTNER = {};
BRACKET_PAIRS.forEach(([x, y]) => { GROUP_PARTNER[x] = y; GROUP_PARTNER[y] = x; });

function seedFixedBracket(advancedTeams) {
  const slots = Array(16).fill(null);
  const winners = advancedTeams.filter(t => t.groupPos === 1);
  const runners = advancedTeams.filter(t => t.groupPos === 2);
  winners.forEach(t => { const s = WINNER_SLOT[t.groupKey]; if (s !== undefined) slots[s] = t; });
  runners.forEach((t, i) => { const s = RUNNERUP_SLOTS[i]; if (s !== undefined) slots[s] = t; });
  // safety net: drop any stragglers into remaining empty slots
  let leftover = advancedTeams.filter(t => !slots.includes(t));
  for (let p = 0; p < 16 && leftover.length; p++) if (!slots[p]) slots[p] = leftover.shift();
  const r16 = [];
  for (let m = 0; m < 8; m++) r16.push([slots[2 * m], slots[2 * m + 1] || null]);
  return r16;
}
// Outcomes depend on BOTH the player's skill (seed) and the team's strength
// (tier): a strong player with a weak team can lose to a weak player wielding
// an elite team. Player coefficient 0.15, team coefficient 0.52.
function simMatch(a, b) {
  const lamb = t => 0.5 + (9 - t.playerIdx) * 0.15 + (5 - t.tier) * 0.52 + Math.random() * 0.3;
  const pois = l => { let L = Math.exp(-l), k = 0, p = 1; do { k++; p *= Math.random(); } while (p > L); return k - 1; };
  return [pois(lamb(a)), pois(lamb(b))];
}

// Team-count handicap: with 9 players, the 3 strongest get 3 teams, the 3
// medium get 4, the 3 weakest get 5 (= 36). Other player counts split 36 evenly.
function teamQuota(idx, total) {
  if (total === 9) return idx < 3 ? 3 : idx < 6 ? 4 : 5;
  const base = Math.floor(36 / total), extra = 36 % total;
  return base + (idx < extra ? 1 : 0);
}

// Auto-pick 36 teams (all Tier 1 + a spread of the rest) and snake-draft them
// to the players, respecting each player's team quota (handicap by seeding).
function autoAssignTeams(players) {
  const byTier = { 1: [], 2: [], 3: [], 4: [] };
  ALL_TEAMS.forEach(t => byTier[t.tier].push({ ...t }));
  const shuf = arr => { const a = [...arr]; for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
  const keep = [...shuf(byTier[1]), ...shuf(byTier[2]).slice(0, 9), ...shuf(byTier[3]).slice(0, 8), ...shuf(byTier[4]).slice(0, 10)];
  const sorted = keep.sort((a, b) => a.tier - b.tier);
  const N = players.length;
  const quotas = players.map((_, i) => teamQuota(i, N));
  const maxRounds = Math.max(...quotas);
  const picks = [], cnt = Array(N).fill(0);
  for (let r = 0; r < maxRounds; r++) {
    const seq = [...Array(N).keys()];
    if (r % 2 === 1) seq.reverse();
    for (const p of seq) { if (cnt[p] < quotas[p]) { picks.push(p); cnt[p]++; } }
  }
  sorted.forEach((t, i) => { t.playerIdx = picks[i]; });
  return sorted;
}

// Auto-draft for Real Groups mode: each real group keeps 3 of its 4 teams,
// assigned to 3 different players, respecting quotas and one-team-per-group.
function autoDraftRealGroups(players) {
  const shuf = arr => { const a = [...arr]; for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
  const N = players.length;
  const quotas = players.map((_, i) => teamQuota(i, N));
  for (let attempt = 0; attempt < 800; attempt++) {
    const claims = {}; const count = Array(N).fill(0); let ok = true;
    for (const gk of shuf(Object.keys(WC_GROUPS))) {
      const keep = shuf([...WC_GROUPS[gk]]).slice(0, 3);   // drop the 4th
      const used = new Set(); let gok = true;
      for (const tname of keep) {
        const cands = shuf([...Array(N).keys()].filter(p =>
          count[p] < quotas[p] && !used.has(p) &&
          !WC_GROUPS[GROUP_PARTNER[gk]].some(pt => claims[pt] === p)));   // bracket-pair lockout
        if (!cands.length) { gok = false; break; }
        const p = cands[0]; claims[tname] = p; count[p]++; used.add(p);
      }
      if (!gok) { ok = false; break; }
    }
    if (ok && Object.keys(claims).length === 36) return claims;
  }
  return null;
}

function simStandings(groupTeams, scores, gKey) {
  const teams = groupTeams.map(t => ({ ...t, pts: 0, gf: 0, ga: 0, gd: 0, mp: 0 }));
  for (let a = 0; a < teams.length; a++) for (let b = a + 1; b < teams.length; b++) {
    const s = scores[`${gKey}-${a}-${b}`]; if (!s) continue;
    const ga = parseInt(s.g0) || 0, gb = parseInt(s.g1) || 0;
    teams[a].gf += ga; teams[a].ga += gb; teams[a].gd += ga - gb; teams[a].mp++;
    teams[b].gf += gb; teams[b].ga += ga; teams[b].gd += gb - ga; teams[b].mp++;
    if (ga > gb) teams[a].pts += 3; else if (gb > ga) teams[b].pts += 3; else { teams[a].pts++; teams[b].pts++; }
  }
  return teams.sort((a, b) => b.pts - a.pts || b.gd - a.gd || b.gf - a.gf);
}

// Play the whole tournament and return initial state for both stages.
function simulateTournament(groups, seedFn = seedKnockout) {
  const groupScores = {}, groupPlayed = {};
  Object.keys(groups).forEach(gk => {
    const teams = groups[gk];
    for (let a = 0; a < teams.length; a++) for (let b = a + 1; b < teams.length; b++) {
      const [ga, gb] = simMatch(teams[a], teams[b]);
      groupScores[`${gk}-${a}-${b}`] = { g0: ga, g1: gb };
      groupPlayed[`${gk}-${a}-${b}`] = true;
    }
  });
  const gks = Object.keys(groups).sort();
  const winners = gks.map(gk => ({ ...simStandings(groups[gk], groupScores, gk)[0], groupKey: gk, groupPos: 1 }));
  const seconds = gks.map(gk => ({ ...simStandings(groups[gk], groupScores, gk)[1], groupKey: gk, groupPos: 2 }))
    .sort((a, b) => b.pts - a.pts || b.gd - a.gd || b.gf - a.gf).slice(0, 4);
  const advancedTeams = [...winners, ...seconds];

  const r16 = seedFn(advancedTeams);
  const koScores = {}, koConfirmed = {};
  const bracket = { r16, qf: Array(4).fill(null).map(() => [null, null]), sf: Array(2).fill(null).map(() => [null, null]), final: [null, null], winner: null };
  const playRound = (pairs, round, writeNext) => {
    pairs.forEach((pair, idx) => {
      const [a, b] = pair; if (!a || !b) return;
      let [ga, gb] = simMatch(a, b);
      if (ga === gb) { Math.random() > 0.5 ? ga++ : gb++; }
      koScores[`${round}-${idx}`] = { g0: ga, g1: gb };
      koConfirmed[`${round}-${idx}`] = true;
      writeNext(idx, ga > gb ? a : b);
    });
  };
  playRound(bracket.r16, "r16", (idx, w) => { bracket.qf[Math.floor(idx / 2)][idx % 2] = w; });
  playRound(bracket.qf, "qf", (idx, w) => { bracket.sf[Math.floor(idx / 2)][idx % 2] = w; });
  playRound(bracket.sf, "sf", (idx, w) => { bracket.final[idx] = w; });
  playRound([bracket.final], "final", (idx, w) => { bracket.winner = w; });

  return { groupScores, groupPlayed, advancedTeams, koBracket: bracket, koScores, koConfirmed };
}

// ─── SETUP ───────────────────────────────────────────────────────
function SetupPhase({ onStart, onAutoPlay }) {
  const [players, setPlayers] = useState(DEFAULT_PLAYERS);
  const [excluded, setExcluded] = useState(new Set());        // manually dropped
  const [autoExcluded, setAutoExcluded] = useState(new Set()); // auto-dropped once all quotas met
  const [assignments, setAssignments] = useState({});
  const [activePlayer, setActivePlayer] = useState(null);
  const [tab, setTab] = useState("players");
  const [groupError, setGroupError] = useState(null);

  const isRemoved = (name) => excluded.has(name) || autoExcluded.has(name);
  const available = ALL_TEAMS.filter(t => !isRemoved(t.name));
  const assignedCount = available.filter(t => assignments[t.name] !== undefined).length;
  const unassignedCount = available.length - assignedCount;
  const allAssigned = unassignedCount === 0 && available.length > 0;

  const playerTeamCount = players.map((_, i) =>
    Object.values(assignments).filter(idx => idx === i).length
  );

  // Once every player has filled their quota, auto-remove the leftover nations.
  const allQuotasMet = players.every((_, i) => playerTeamCount[i] === teamQuota(i, players.length));
  useEffect(() => {
    if (allQuotasMet) {
      const leftover = ALL_TEAMS.filter(t => assignments[t.name] === undefined && !excluded.has(t.name)).map(t => t.name);
      setAutoExcluded(new Set(leftover));
    } else {
      setAutoExcluded(prev => (prev.size ? new Set() : prev));
    }
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, [assignments, excluded, players]);

  const toggleExclude = (name) => {
    if (autoExcluded.has(name)) return; // auto-removed teams come back by unassigning, not by clicking
    setExcluded(prev => {
      const next = new Set(prev);
      if (next.has(name)) next.delete(name); else next.add(name);
      return next;
    });
    setAssignments(prev => { const n = { ...prev }; delete n[name]; return n; });
  };

  const handleTeamClick = (teamName) => {
    if (isRemoved(teamName) || activePlayer === null) return;
    if (assignments[teamName] !== undefined) {
      setAssignments(prev => { const n = { ...prev }; delete n[teamName]; return n; });
    } else {
      // don't let a player exceed their quota
      if (playerTeamCount[activePlayer] >= teamQuota(activePlayer, players.length)) return;
      setAssignments(prev => ({ ...prev, [teamName]: activePlayer }));
    }
  };

  const handleStart = () => {
    setGroupError(null);
    const selectedTeams = available.map(t => ({ ...t, playerIdx: assignments[t.name] }));
    const groups = buildFairGroups(selectedTeams);
    if (!groups) {
      setGroupError("Couldn't build fair groups — try rebalancing team assignments so no player has too many teams concentrated in one tier.");
      return;
    }
    // Attach group letter to each team
    const teamsWithGroups = [];
    Object.entries(groups).forEach(([letter, gTeams]) => {
      gTeams.forEach(t => teamsWithGroups.push({ ...t, group: letter }));
    });
    onStart({ players, selectedTeams: teamsWithGroups, groups });
  };

  return (
    <div style={{ minHeight: "100vh", background: "#f8f7f4", color: "#1a1a18", fontFamily: "'Georgia', serif" }}>
      {/* Header */}
      <div style={{ background: "#fff", borderBottom: "2px solid #b8913a", padding: "18px 20px 14px", textAlign: "center" }}>
        <div style={{ fontSize: 11, letterSpacing: 5, color: "#b8913a", marginBottom: 3 }}>FC TOURNAMENT</div>
        <h1 style={{ margin: 0, fontSize: 24, color: "#b8913a", fontWeight: 700 }}>World Cup 2026 Edition</h1>
        <div style={{ fontSize: 10, color: "#888880", marginTop: 3, letterSpacing: 2 }}>TOURNAMENT SETUP</div>
      </div>

      {/* Tabs */}
      <div style={{ display: "flex", borderBottom: "1px solid #e0dbd0", background: "#f0ede6" }}>
        {[["players", "👥 Players"], ["teams", "⚽ Teams"]].map(([key, label]) => (
          <button key={key} onClick={() => setTab(key)} style={{
            flex: 1, padding: "11px 8px", border: "none", cursor: "pointer", fontFamily: "inherit",
            fontSize: 11, letterSpacing: 2, textTransform: "uppercase",
            background: tab === key ? "#fff" : "transparent",
            color: tab === key ? "#b8913a" : "#888880",
            borderBottom: tab === key ? "2px solid #b8913a" : "2px solid transparent",
          }}>{label}</button>
        ))}
      </div>

      {tab === "players" && (
        <div style={{ padding: "20px 16px" }}>
          <p style={{ color: "#888880", fontSize: 12, textAlign: "center", margin: "0 0 6px", letterSpacing: 1 }}>
            Enter names in seed order (1 = strongest). Handicap: seeds 1–3 get 3 teams, 4–6 get 4, 7–9 get 5.
          </p>
          <p style={{ color: "#aaaaaa", fontSize: 11, textAlign: "center", margin: "0 0 16px", letterSpacing: 1 }}>
            Groups are auto-built so each group always has 3 different players.
          </p>
          <div style={{ display: "grid", gridTemplateColumns: "1fr", gap: 8, maxWidth: 420, margin: "0 auto 20px" }}>
            {players.map((p, i) => (
              <div key={i} style={{ display: "flex", alignItems: "center", gap: 8, background: "#fff", border: `1px solid ${PLAYER_COLORS[i]}66`, borderRadius: 8, padding: "8px 10px", boxShadow: "0 1px 3px rgba(0,0,0,0.06)" }}>
                <span style={{ fontSize: 11, color: "#888880", fontWeight: 700, minWidth: 16 }}>{i + 1}</span>
                <div style={{ width: 10, height: 10, borderRadius: "50%", background: PLAYER_COLORS[i], flexShrink: 0 }} />
                <input value={p} onChange={e => setPlayers(prev => prev.map((x, j) => j === i ? e.target.value : x))}
                  style={{ flex: 1, background: "transparent", border: "none", outline: "none", color: "#1a1a18", fontFamily: "inherit", fontSize: 13 }} />
                <span style={{ fontSize: 10, color: playerTeamCount[i] === teamQuota(i, players.length) ? "#22a060" : PLAYER_COLORS[i], fontWeight: 700, minWidth: 30, textAlign: "right" }}>{playerTeamCount[i]}/{teamQuota(i, players.length)}</span>
              </div>
            ))}
          </div>
          <div style={{ textAlign: "center" }}>
            <button onClick={() => setTab("teams")} style={{
              background: "#b8913a", color: "#fff", border: "none", borderRadius: 6,
              padding: "10px 28px", fontFamily: "inherit", fontSize: 12, fontWeight: 700, cursor: "pointer", letterSpacing: 2
            }}>NEXT: ASSIGN TEAMS →</button>
            <div style={{ marginTop: 16 }}>
              <button onClick={() => onAutoPlay(players)} style={{
                background: "transparent", color: "#b8913a", border: "1px solid #b8913a66", borderRadius: 6,
                padding: "9px 24px", fontFamily: "inherit", fontSize: 12, fontWeight: 700, cursor: "pointer", letterSpacing: 2
              }}>⚡ AUTO-PLAY (QUICK SIM)</button>
              <div style={{ fontSize: 10, color: "#aaaaaa", marginTop: 6 }}>Auto-drafts teams & simulates the whole tournament</div>
            </div>
          </div>
        </div>
      )}

      {tab === "teams" && (
        <div style={{ padding: "14px 14px 90px" }}>
          {/* Status */}
          <div style={{ display: "flex", gap: 8, flexWrap: "wrap", justifyContent: "center", marginBottom: 10 }}>
            <span style={{ fontSize: 11, color: "#b8913a", background: "#fff", borderRadius: 4, padding: "4px 10px", border: "1px solid #b8913a33" }}>
              {available.length} teams
            </span>
            <span style={{ fontSize: 11, color: allAssigned ? "#22a060" : "#cc3333", background: "#fff", borderRadius: 4, padding: "4px 10px", border: `1px solid ${allAssigned ? "#22a06033" : "#cc333333"}` }}>
              {assignedCount}/{available.length} assigned
            </span>
            {excluded.size > 0 && (
              <span style={{ fontSize: 11, color: "#888880", background: "#fff", borderRadius: 4, padding: "4px 10px", border: "1px solid #e0dbd0" }}>
                {excluded.size} dropped
              </span>
            )}
          </div>

          <div style={{ background: "#fff", border: "1px solid #e0dbd0", borderRadius: 8, padding: "9px 13px", marginBottom: 12, fontSize: 12, color: "#888880", lineHeight: 1.6 }}>
            <strong style={{ color: "#b8913a" }}>How to assign:</strong> Select a player → tap teams to assign (up to their quota). Tap again to unassign. Once every player is full, the leftover nations are removed automatically.
          </div>

          {/* Player selector */}
          <div style={{ display: "flex", gap: 5, flexWrap: "wrap", justifyContent: "center", marginBottom: 12 }}>
            <button onClick={() => setActivePlayer(null)} style={{
              padding: "5px 10px", borderRadius: 4, border: "1px solid #e0dbd0", cursor: "pointer",
              background: activePlayer === null ? "#e0dbd0" : "#fff",
              color: activePlayer === null ? "#1a1a18" : "#888880",
              fontSize: 11, fontFamily: "inherit"
            }}>👁 View</button>
            {players.map((p, i) => (
              <button key={i} onClick={() => setActivePlayer(i)} style={{
                padding: "5px 10px", borderRadius: 4, border: `1px solid ${PLAYER_COLORS[i]}66`, cursor: "pointer",
                background: activePlayer === i ? PLAYER_COLORS[i] : "#fff",
                color: activePlayer === i ? "#fff" : PLAYER_COLORS[i],
                fontSize: 11, fontFamily: "inherit", fontWeight: activePlayer === i ? 700 : 400
              }}>{p} ({playerTeamCount[i]}/{teamQuota(i, players.length)})</button>
            ))}
          </div>

          {activePlayer !== null
            ? <p style={{ textAlign: "center", fontSize: 11, color: "#888880", margin: "0 0 12px" }}>Assigning to <strong style={{ color: PLAYER_COLORS[activePlayer] }}>{players[activePlayer]}</strong></p>
            : <p style={{ textAlign: "center", fontSize: 11, color: "#aaaaaa", margin: "0 0 12px" }}>↑ Select a player first</p>
          }

          {/* Teams by tier — one column per tier */}
          <div style={{ display: "grid", gridTemplateColumns: "repeat(4, minmax(0, 1fr))", gap: 8 }}>
            {[1, 2, 3, 4].map(tier => (
              <div key={tier}>
                <div style={{ fontSize: 9, letterSpacing: 1, color: TIER_COLOR[tier], marginBottom: 6, textTransform: "uppercase", textAlign: "center" }}>
                  T{tier} · {TIER_LABEL[tier]}
                </div>
                <div style={{ display: "flex", flexDirection: "column", gap: 5 }}>
                  {ALL_TEAMS.filter(t => t.tier === tier && !autoExcluded.has(t.name)).map(team => {
                    const isExcluded = excluded.has(team.name);
                    const assignedTo = assignments[team.name];
                    const isAssigned = assignedTo !== undefined;
                    const aColor = isAssigned ? PLAYER_COLORS[assignedTo] : null;
                    return (
                      <div key={team.name} style={{ display: "flex", alignItems: "center", gap: 2 }}>
                        <button onClick={() => handleTeamClick(team.name)} style={{
                          flex: 1, minWidth: 0, textAlign: "left",
                          padding: "5px 6px", borderRadius: 4,
                          cursor: isExcluded ? "default" : "pointer",
                          border: `1px solid ${isExcluded ? "#e0dbd0" : isAssigned ? aColor + "99" : activePlayer !== null ? "#c8c0b0" : "#e0dbd0"}`,
                          background: isExcluded ? "#f0ede6" : isAssigned ? aColor + "18" : "#fff",
                          color: isExcluded ? "#bbbbbb" : isAssigned ? aColor : "#444440",
                          fontSize: 11, fontFamily: "inherit", lineHeight: 1.25,
                          textDecoration: isExcluded ? "line-through" : "none",
                          outline: activePlayer !== null && !isExcluded && !isAssigned ? `1px dashed ${PLAYER_COLORS[activePlayer]}55` : "none",
                        }}>
                          {team.flag} {team.name}
                          {isAssigned && <span style={{ display: "block", fontSize: 9, opacity: 0.85 }}>{players[assignedTo].split(" ")[0]}</span>}
                        </button>
                        <button onClick={() => toggleExclude(team.name)} style={{
                          background: "none", border: "none", cursor: "pointer", padding: "0 2px",
                          fontSize: 12, color: isExcluded ? "#22a060" : "#bbbbbb", lineHeight: 1,
                        }}>{isExcluded ? "+" : "×"}</button>
                      </div>
                    );
                  })}
                </div>
              </div>
            ))}
          </div>

          {groupError && (
            <div style={{ background: "#fff0f0", border: "1px solid #cc333366", borderRadius: 8, padding: "10px 14px", marginTop: 10, fontSize: 12, color: "#cc3333" }}>
              ⚠️ {groupError}
            </div>
          )}
        </div>
      )}

      {/* Sticky bottom button */}
      {tab === "teams" && (
        <div style={{ position: "fixed", bottom: 0, left: 0, right: 0, background: "linear-gradient(transparent, #f8f7f4 35%)", padding: "16px", display: "flex", flexDirection: "column", alignItems: "center", gap: 5 }}>
          {!allAssigned && (
            <div style={{ fontSize: 11, color: "#cc3333" }}>
              {unassignedCount} team{unassignedCount !== 1 ? "s" : ""} still unassigned
            </div>
          )}
          <button onClick={allAssigned ? handleStart : undefined} style={{
            background: allAssigned ? "#b8913a" : "#e0dbd0",
            color: allAssigned ? "#fff" : "#aaaaaa",
            border: "none",
            borderRadius: 8, padding: "12px 40px", fontFamily: "inherit",
            fontSize: 13, fontWeight: 700, cursor: allAssigned ? "pointer" : "not-allowed",
            letterSpacing: 3,
          }}>
            {allAssigned ? "🏆 BUILD GROUPS & START" : "⏳ ASSIGN ALL TEAMS FIRST"}
          </button>
        </div>
      )}
    </div>
  );
}

// ─── GROUP STAGE ─────────────────────────────────────────────────
function GroupStage({ players, selectedTeams, groups, onAdvance, initialScores, initialPlayed, onStateChange }) {
  const groupKeys = Object.keys(groups).sort();

  const [scores, setScores] = useState(initialScores || {});
  const [played, setPlayed] = useState(initialPlayed || {});
  const [activeGroup, setActiveGroup] = useState(groupKeys[0]);

  const setScore = (key, side, val) => {
    setScores(prev => {
      const next = { ...prev, [key]: { ...prev[key], [side]: val === "" ? "" : Math.max(0, parseInt(val) || 0) } };
      onStateChange && onStateChange({ groupScores: next, groupPlayed: played });
      return next;
    });
  };

  const markPlayed = (key) => {
    setPlayed(prev => {
      const next = { ...prev, [key]: true };
      onStateChange && onStateChange({ groupScores: scores, groupPlayed: next });
      return next;
    });
  };

  const unmarkPlayed = (key) => {
    setPlayed(prev => {
      const next = { ...prev, [key]: false };
      onStateChange && onStateChange({ groupScores: scores, groupPlayed: next });
      return next;
    });
  };

  const getMatchPairs = (gKey) => {
    const teams = groups[gKey] || [];
    const pairs = [];
    for (let a = 0; a < teams.length; a++)
      for (let b = a + 1; b < teams.length; b++)
        pairs.push([a, b, `${gKey}-${a}-${b}`]);
    return pairs;
  };

  const getStandings = (gKey) => {
    const teams = (groups[gKey] || []).map(t => ({ ...t, pts: 0, gf: 0, ga: 0, gd: 0, mp: 0 }));
    getMatchPairs(gKey).forEach(([ai, bi, key]) => {
      if (!played[key]) return;
      const s = scores[key] || {};
      const ga = parseInt(s.g0) || 0, gb = parseInt(s.g1) || 0;
      teams[ai].gf += ga; teams[ai].ga += gb; teams[ai].gd += ga - gb; teams[ai].mp++;
      teams[bi].gf += gb; teams[bi].ga += ga; teams[bi].gd += gb - ga; teams[bi].mp++;
      if (ga > gb) teams[ai].pts += 3;
      else if (gb > ga) teams[bi].pts += 3;
      else { teams[ai].pts += 1; teams[bi].pts += 1; }
    });
    return teams.sort((a, b) => b.pts - a.pts || b.gd - a.gd || b.gf - a.gf);
  };

  const allGroupsDone = groupKeys.every(gk => getMatchPairs(gk).every(([, , k]) => played[k]));

  const handleAdvance = () => {
    const winners = groupKeys.map(gk => ({ ...getStandings(gk)[0], groupKey: gk, groupPos: 1 }));
    const seconds = groupKeys.map(gk => {
      const s = getStandings(gk);
      return s[1] ? { ...s[1], groupKey: gk, groupPos: 2 } : null;
    }).filter(Boolean).sort((a, b) => b.pts - a.pts || b.gd - a.gd || b.gf - a.gf).slice(0, 4);
    onAdvance([...winners, ...seconds]);
  };

  // Light theme tokens
  const BG      = "#f8f7f4";
  const CARD    = "#ffffff";
  const BORDER  = "#e0dbd0";
  const MUTED   = "#888880";
  const TEXT    = "#1a1a18";
  const ACCENT  = "#b8913a";
  const TABBAR  = "#f0ede6";

  return (
    <div style={{ minHeight: "100vh", background: BG, color: TEXT, fontFamily: "'Georgia', serif" }}>
      {/* Header */}
      <div style={{ background: "#fff", borderBottom: `2px solid ${ACCENT}`, padding: "14px 20px", textAlign: "center" }}>
        <div style={{ fontSize: 10, letterSpacing: 5, color: ACCENT }}>FC TOURNAMENT · WORLD CUP EDITION</div>
        <h2 style={{ margin: "3px 0 0", fontSize: 22, color: ACCENT, fontWeight: 700 }}>Group Stage</h2>
        <div style={{ fontSize: 10, color: MUTED, marginTop: 3 }}>Each group has 3 different players</div>
      </div>

      {/* Tab bar — Overview + each group */}
      <div style={{ display: "flex", overflowX: "auto", borderBottom: `1px solid ${BORDER}`, background: TABBAR }}>
        {/* Overview tab */}
        <button onClick={() => setActiveGroup("__overview__")} style={{
          padding: "10px 16px", border: "none", cursor: "pointer", fontFamily: "inherit", fontSize: 13, fontWeight: 700, flexShrink: 0,
          background: activeGroup === "__overview__" ? "#fff" : "transparent",
          color: activeGroup === "__overview__" ? ACCENT : MUTED,
          borderBottom: activeGroup === "__overview__" ? `2px solid ${ACCENT}` : "2px solid transparent",
        }}>📋 Overview</button>
        {groupKeys.map(gk => {
          const done = getMatchPairs(gk).every(([, , k]) => played[k]);
          return (
            <button key={gk} onClick={() => setActiveGroup(gk)} style={{
              padding: "10px 16px", border: "none", cursor: "pointer", fontFamily: "inherit", fontSize: 13, fontWeight: 700, flexShrink: 0,
              background: activeGroup === gk ? "#fff" : "transparent",
              color: activeGroup === gk ? ACCENT : done ? "#22a060" : MUTED,
              borderBottom: activeGroup === gk ? `2px solid ${ACCENT}` : "2px solid transparent",
            }}>{gk}{done ? " ✓" : ""}</button>
          );
        })}
      </div>

      {/* ── OVERVIEW ── */}
      {activeGroup === "__overview__" && (
        <div style={{ padding: "18px 16px" }}>
          <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fill, minmax(260px, 1fr))", gap: 14 }}>
            {groupKeys.map(gk => {
              const gTeams = groups[gk] || [];
              const standings = getStandings(gk);
              const done = getMatchPairs(gk).every(([, , k]) => played[k]);
              return (
                <div key={gk} onClick={() => setActiveGroup(gk)} style={{ background: CARD, border: `1px solid ${done ? "#22a060" : BORDER}`, borderRadius: 10, overflow: "hidden", cursor: "pointer", boxShadow: "0 1px 4px #0001" }}>
                  <div style={{ background: done ? "#e8f5ee" : "#f5f3ee", padding: "8px 14px", borderBottom: `1px solid ${BORDER}`, display: "flex", justifyContent: "space-between", alignItems: "center" }}>
                    <span style={{ fontWeight: 700, fontSize: 15, color: done ? "#22a060" : ACCENT }}>Group {gk}</span>
                    {done && <span style={{ fontSize: 12, color: "#22a060", fontWeight: 700 }}>✓ Done</span>}
                  </div>
                  <div style={{ padding: "10px 14px" }}>
                    {standings.map((t, i) => (
                      <div key={t.name} style={{ display: "flex", alignItems: "center", gap: 8, padding: "5px 0", borderBottom: i < standings.length - 1 ? `1px solid ${BORDER}` : "none" }}>
                        <span style={{ fontSize: 11, color: MUTED, width: 14, textAlign: "center" }}>{i + 1}</span>
                        <span style={{ width: 8, height: 8, borderRadius: "50%", background: PLAYER_COLORS[t.playerIdx], flexShrink: 0 }} />
                        <span style={{ flex: 1, fontSize: 14 }}>{t.flag} {t.name}</span>
                        <span style={{ fontSize: 12, color: PLAYER_COLORS[t.playerIdx] }}>{players[t.playerIdx].split(" ")[0]}</span>
                        <span style={{ fontSize: 13, fontWeight: 700, minWidth: 22, textAlign: "right", color: TEXT }}>{t.pts}</span>
                      </div>
                    ))}
                  </div>
                </div>
              );
            })}
          </div>
        </div>
      )}

      {/* ── GROUP DETAIL ── */}
      {activeGroup && activeGroup !== "__overview__" && (() => {
        const gTeams = groups[activeGroup] || [];
        const standings = getStandings(activeGroup);
        const pairs = getMatchPairs(activeGroup);
        return (
          <div style={{ padding: "18px", maxWidth: 680, margin: "0 auto" }}>
            {/* Players in this group */}
            <div style={{ display: "flex", gap: 8, justifyContent: "center", marginBottom: 16 }}>
              {gTeams.map(t => (
                <div key={t.name} style={{ display: "flex", alignItems: "center", gap: 6, background: "#fff", border: `1px solid ${PLAYER_COLORS[t.playerIdx]}66`, borderRadius: 20, padding: "5px 13px", fontSize: 13 }}>
                  <div style={{ width: 8, height: 8, borderRadius: "50%", background: PLAYER_COLORS[t.playerIdx] }} />
                  <span style={{ color: PLAYER_COLORS[t.playerIdx], fontWeight: 600 }}>{players[t.playerIdx]}</span>
                </div>
              ))}
            </div>

            {/* Standings */}
            <div style={{ marginBottom: 18 }}>
              <div style={{ fontSize: 11, letterSpacing: 3, color: MUTED, marginBottom: 8, textTransform: "uppercase" }}>Standings</div>
              <div style={{ background: CARD, borderRadius: 10, overflow: "hidden", border: `1px solid ${BORDER}`, boxShadow: "0 1px 4px #0001" }}>
                <div style={{ display: "grid", gridTemplateColumns: "1fr 42px 42px 42px 42px 42px", padding: "6px 13px", fontSize: 11, color: MUTED, letterSpacing: 1, borderBottom: `1px solid ${BORDER}`, background: "#f5f3ee" }}>
                  <span>TEAM</span><span style={{ textAlign: "center" }}>MP</span><span style={{ textAlign: "center" }}>GD</span><span style={{ textAlign: "center" }}>GF</span><span style={{ textAlign: "center" }}>GA</span><span style={{ textAlign: "center" }}>PTS</span>
                </div>
                {standings.map((t, i) => (
                  <div key={t.name} style={{ display: "grid", gridTemplateColumns: "1fr 42px 42px 42px 42px 42px", padding: "9px 13px", fontSize: 15, borderBottom: i < standings.length - 1 ? `1px solid ${BORDER}` : "none", background: i === 0 ? "rgba(184,145,58,0.07)" : CARD }}>
                    <div style={{ display: "flex", alignItems: "center", gap: 6 }}>
                      <span style={{ width: 9, height: 9, borderRadius: "50%", background: PLAYER_COLORS[t.playerIdx], display: "inline-block", flexShrink: 0 }} />
                      <span>{t.flag} {t.name} <span style={{ color: PLAYER_COLORS[t.playerIdx], fontSize: 12 }}>({players[t.playerIdx]})</span></span>
                      {i === 0 && <span style={{ fontSize: 11, color: ACCENT }}>▲</span>}
                    </div>
                    <span style={{ textAlign: "center", color: MUTED }}>{t.mp}</span>
                    <span style={{ textAlign: "center", color: t.gd > 0 ? "#22a060" : t.gd < 0 ? "#cc3333" : MUTED }}>{t.gd > 0 ? "+" : ""}{t.gd}</span>
                    <span style={{ textAlign: "center", color: MUTED }}>{t.gf}</span>
                    <span style={{ textAlign: "center", color: MUTED }}>{t.ga}</span>
                    <span style={{ textAlign: "center", fontWeight: 700, color: TEXT }}>{t.pts}</span>
                  </div>
                ))}
              </div>
            </div>

            {/* Matches */}
            <div>
              <div style={{ fontSize: 11, letterSpacing: 3, color: MUTED, marginBottom: 8, textTransform: "uppercase" }}>Matches</div>
              {pairs.map(([ai, bi, key]) => {
                const ta = gTeams[ai], tb = gTeams[bi];
                const s = scores[key] || {};
                const isDone = played[key];
                return (
                  <div key={key} style={{ background: isDone ? "rgba(34,160,96,0.06)" : CARD, border: `1px solid ${isDone ? "#22a06055" : BORDER}`, borderRadius: 10, padding: "13px 16px", marginBottom: 10, boxShadow: "0 1px 4px #0001" }}>
                    <div style={{ display: "flex", alignItems: "center", gap: 10 }}>
                      <div style={{ flex: 1, textAlign: "right" }}>
                        <div style={{ fontSize: 16 }}>{ta.flag} {ta.name}</div>
                        <div style={{ fontSize: 12, color: PLAYER_COLORS[ta.playerIdx] }}>{players[ta.playerIdx]}</div>
                      </div>
                      <div style={{ display: "flex", alignItems: "center", gap: 6 }}>
                        <input type="number" min="0" value={s.g0 ?? ""} onChange={e => setScore(key, "g0", e.target.value)} disabled={isDone}
                          style={{ width: 44, textAlign: "center", background: isDone ? "#f5f3ee" : "#fff", border: `1px solid ${BORDER}`, borderRadius: 6, color: TEXT, fontFamily: "inherit", fontSize: 20, padding: "4px 0", fontWeight: 700 }} />
                        <span style={{ color: MUTED, fontSize: 16 }}>–</span>
                        <input type="number" min="0" value={s.g1 ?? ""} onChange={e => setScore(key, "g1", e.target.value)} disabled={isDone}
                          style={{ width: 44, textAlign: "center", background: isDone ? "#f5f3ee" : "#fff", border: `1px solid ${BORDER}`, borderRadius: 6, color: TEXT, fontFamily: "inherit", fontSize: 20, padding: "4px 0", fontWeight: 700 }} />
                      </div>
                      <div style={{ flex: 1 }}>
                        <div style={{ fontSize: 16 }}>{tb.flag} {tb.name}</div>
                        <div style={{ fontSize: 12, color: PLAYER_COLORS[tb.playerIdx] }}>{players[tb.playerIdx]}</div>
                      </div>
                      {!isDone
                        ? <button onClick={() => markPlayed(key)} style={{ background: ACCENT, color: "#fff", border: "none", borderRadius: 6, padding: "7px 13px", cursor: "pointer", fontSize: 13, fontFamily: "inherit", fontWeight: 700 }}>✓</button>
                        : <button onClick={() => unmarkPlayed(key)} title="Edit result" style={{ background: "none", border: `1px solid ${BORDER}`, borderRadius: 6, padding: "6px 10px", cursor: "pointer", fontSize: 13, color: MUTED }}>✏️</button>}
                    </div>
                  </div>
                );
              })}
            </div>
          </div>
        );
      })()}

      {allGroupsDone && activeGroup !== "__overview__" && (
        <div style={{ textAlign: "center", padding: "20px" }}>
          <button onClick={handleAdvance} style={{ background: ACCENT, color: "#fff", border: "none", borderRadius: 8, padding: "14px 40px", fontFamily: "inherit", fontSize: 14, fontWeight: 700, cursor: "pointer", letterSpacing: 3 }}>
            ⚡ ADVANCE TO KNOCKOUT →
          </button>
        </div>
      )}
      {allGroupsDone && activeGroup === "__overview__" && (
        <div style={{ textAlign: "center", padding: "20px" }}>
          <button onClick={handleAdvance} style={{ background: ACCENT, color: "#fff", border: "none", borderRadius: 8, padding: "14px 40px", fontFamily: "inherit", fontSize: 14, fontWeight: 700, cursor: "pointer", letterSpacing: 3 }}>
            ⚡ ADVANCE TO KNOCKOUT →
          </button>
        </div>
      )}
    </div>
  );
}

// ─── KNOCKOUT ────────────────────────────────────────────────────
function KnockoutStage({ players, advancedTeams, initialBracket, initialScores, initialConfirmed, seedFn = seedKnockout, onStateChange }) {
  const [bracket, setBracket] = useState(() => {
    if (initialBracket) return initialBracket;
    const r16 = seedFn(advancedTeams);
    return { r16, qf: Array(4).fill(null).map(() => [null, null]), sf: Array(2).fill(null).map(() => [null, null]), final: [null, null], winner: null };
  });
  const [scores, setScores] = useState(initialScores || {});
  const [confirmed, setConfirmed] = useState(initialConfirmed || {});
  const [selfMatchQueue, setSelfMatchQueue] = useState([]);
  const [resolvedSelfMatches, setResolvedSelfMatches] = useState({});

  const setScore = (key, side, val) => setScores(prev => {
    const next = { ...prev, [key]: { ...prev[key], [side]: val === "" ? "" : Math.max(0, parseInt(val) || 0) } };
    onStateChange && onStateChange({ koBracket: bracket, koScores: next, koConfirmed: confirmed });
    return next;
  });

  // ── Self-match helpers ─────────────────────────────────────────
  // For a team in round/matchIdx/slot, find who it beat in the previous round
  // and return that opponent plus the margin (gd) and goals they scored (loserGoals).
  const getPrevOpponentInfo = (bkt, sc, round, matchIdx, slot) => {
    const prevRound = { qf: "r16", sf: "qf", final: "sf" }[round];
    const prevMatchIdx = round === "final" ? slot : matchIdx * 2 + slot;
    const prevPair = bkt[prevRound][prevMatchIdx];
    const currentTeam = round === "final" ? bkt.final[slot] : bkt[round][matchIdx][slot];
    if (!prevPair || !currentTeam) return null;
    const winnerSlot = prevPair[0] && prevPair[0].name === currentTeam.name ? 0 : 1;
    const loserSlot = 1 - winnerSlot;
    const s = sc[`${prevRound}-${prevMatchIdx}`] || {};
    const winnerGoals = parseInt(s[`g${winnerSlot}`]) || 0;
    const loserGoals = parseInt(s[`g${loserSlot}`]) || 0;
    return { opponent: prevPair[loserSlot], gd: winnerGoals - loserGoals, loserGoals };
  };

  // Pick the better previous opponent: smallest goal difference, then most goals scored by loser.
  const findReplacement = (bkt, sc, round, matchIdx) => {
    const infoA = getPrevOpponentInfo(bkt, sc, round, matchIdx, 0);
    const infoB = getPrevOpponentInfo(bkt, sc, round, matchIdx, 1);
    if (!infoA?.opponent) return infoB?.opponent || null;
    if (!infoB?.opponent) return infoA.opponent;
    if (infoA.gd < infoB.gd) return infoA.opponent;
    if (infoB.gd < infoA.gd) return infoB.opponent;
    return infoA.loserGoals >= infoB.loserGoals ? infoA.opponent : infoB.opponent;
  };

  // Scan a bracket for self-matches not yet resolved; compute replacement for each.
  const detectSelfMatches = (bkt, sc, resolved) => {
    const found = [];
    const check = (smRound, smMatchIdx, tA, tB) => {
      if (!tA || !tB || tA.playerIdx !== tB.playerIdx) return;
      const smKey = `${smRound}-${smMatchIdx}`;
      if (resolved[smKey]) return;
      found.push({ smKey, round: smRound, matchIdx: smMatchIdx, teamA: tA, teamB: tB, replacement: findReplacement(bkt, sc, smRound, smMatchIdx) });
    };
    bkt.qf.forEach((pair, i) => check("qf", i, pair[0], pair[1]));
    bkt.sf.forEach((pair, i) => check("sf", i, pair[0], pair[1]));
    if (bkt.final[0] && bkt.final[1]) check("final", 0, bkt.final[0], bkt.final[1]);
    return found;
  };

  const confirmMatch = (round, idx) => {
    const key = `${round}-${idx}`;
    const s = scores[key] || {};
    const g0 = parseInt(s.g0) || 0, g1 = parseInt(s.g1) || 0;
    if (g0 === g1) { alert("Knockout needs a winner — enter extra time/penalties result!"); return; }
    const winnerSlot = g0 > g1 ? 0 : 1;
    // Compute next bracket synchronously so we can detect self-matches right away.
    const next = JSON.parse(JSON.stringify(bracket));
    if (round === "r16") { next.qf[Math.floor(idx / 2)][idx % 2] = next.r16[idx][winnerSlot]; }
    else if (round === "qf") { next.sf[Math.floor(idx / 2)][idx % 2] = next.qf[idx][winnerSlot]; }
    else if (round === "sf") { next.final[idx] = next.sf[idx][winnerSlot]; }
    else if (round === "final") { next.winner = next.final[winnerSlot]; }
    setBracket(next);
    setConfirmed(prev => {
      const nextC = { ...prev, [key]: true };
      onStateChange && onStateChange({ koBracket: next, koScores: scores, koConfirmed: nextC });
      return nextC;
    });
    // Detect any self-matches introduced into the next round.
    const newSMs = detectSelfMatches(next, scores, resolvedSelfMatches);
    if (newSMs.length > 0) setSelfMatchQueue(prev => {
      const existingKeys = new Set(prev.map(x => x.smKey));
      return [...prev, ...newSMs.filter(x => !existingKeys.has(x.smKey))];
    });
  };

  // Player picks which of their two teams continues; the other is replaced.
  const resolveSelfMatch = (smKey, round, matchIdx, keptTeam) => {
    const item = selfMatchQueue.find(x => x.smKey === smKey);
    if (!item) return;
    const next = JSON.parse(JSON.stringify(bracket));
    const pair = round === "final" ? next.final : next[round][matchIdx];
    const keptSlot = pair[0] && pair[0].name === keptTeam.name ? 0 : 1;
    if (round === "final") next.final[1 - keptSlot] = item.replacement;
    else next[round][matchIdx][1 - keptSlot] = item.replacement;
    setBracket(next);
    onStateChange && onStateChange({ koBracket: next, koScores: scores, koConfirmed: confirmed });
    setResolvedSelfMatches(prev => ({ ...prev, [smKey]: true }));
    setSelfMatchQueue(prev => prev.filter(x => x.smKey !== smKey));
  };

  const renderMatch = (round, idx, teamA, teamB) => {
    const key = `${round}-${idx}`;
    const s = scores[key] || {};
    const isDone = confirmed[key];
    const isFinal = round === "final";
    if (!teamA && !teamB) return (
      <div key={key} style={{ background: "#0d1117", border: "1px solid #1a2030", borderRadius: 6, padding: "10px", marginBottom: 6, opacity: 0.35, fontSize: 11, color: "#334455", textAlign: "center" }}>
        Awaiting results…
      </div>
    );
    return (
      <div key={key} style={{ background: isDone ? "rgba(34,197,94,0.05)" : isFinal ? "rgba(201,168,76,0.07)" : "#131820", border: `1px solid ${isDone ? "#22c55e44" : isFinal ? "#c9a84c55" : "#1e2533"}`, borderRadius: 6, padding: "10px", marginBottom: 6 }}>
        {[teamA, teamB].map((team, si) => (
          <div key={si} style={{ display: "flex", alignItems: "center", gap: 6, marginBottom: si === 0 ? 5 : 0 }}>
            {team ? <>
              <div style={{ width: 8, height: 8, borderRadius: "50%", background: PLAYER_COLORS[team.playerIdx], flexShrink: 0 }} />
              <span style={{ flex: 1, fontSize: 12 }}>{team.flag} {team.name} <span style={{ color: PLAYER_COLORS[team.playerIdx], fontSize: 10 }}>({players[team.playerIdx]})</span></span>
              <input type="number" min="0" value={s[`g${si}`] ?? ""} onChange={e => setScore(key, `g${si}`, e.target.value)} disabled={isDone}
                style={{ width: 32, textAlign: "center", background: "#0d1117", border: "1px solid #2a3545", borderRadius: 3, color: "#e8e0d0", fontFamily: "inherit", fontSize: 14, padding: "2px 0" }} />
            </> : <span style={{ fontSize: 11, color: "#334455", flex: 1 }}>TBD</span>}
          </div>
        ))}
        {!isDone && teamA && teamB && (
          <button onClick={() => confirmMatch(round, idx)} style={{ marginTop: 7, width: "100%", background: isFinal ? "#c9a84c22" : "#1a2535", border: `1px solid ${isFinal ? "#c9a84c66" : "#2a3545"}`, color: isFinal ? "#c9a84c" : "#667788", borderRadius: 4, padding: "5px", cursor: "pointer", fontFamily: "inherit", fontSize: 11, letterSpacing: 1 }}>
            CONFIRM ✓
          </button>
        )}
        {isDone && <div style={{ textAlign: "center", fontSize: 10, color: "#22c55e", marginTop: 5 }}>✅ Done</div>}
      </div>
    );
  };

  const rounds = [
    { key: "r16", label: "Round of 16", pairs: bracket.r16.map((p, i) => [i, p[0], p[1]]) },
    { key: "qf", label: "Quarter-Finals", pairs: bracket.qf.map((p, i) => [i, p[0], p[1]]) },
    { key: "sf", label: "Semi-Finals", pairs: bracket.sf.map((p, i) => [i, p[0], p[1]]) },
    { key: "final", label: "🏆 Final", pairs: [[0, bracket.final[0], bracket.final[1]]] },
  ];

  return (
    <div style={{ minHeight: "100vh", background: "#0f1117", color: "#e8e0d0", fontFamily: "'Georgia', serif" }}>
      <div style={{ background: "linear-gradient(135deg,#1a1f2e,#0f1117)", borderBottom: "2px solid #c9a84c", padding: "14px 20px", textAlign: "center" }}>
        <div style={{ fontSize: 10, letterSpacing: 5, color: "#c9a84c" }}>FC TOURNAMENT · WORLD CUP EDITION</div>
        <h2 style={{ margin: "3px 0 0", fontSize: 20, background: "linear-gradient(90deg,#c9a84c,#f5e1a4,#c9a84c)", WebkitBackgroundClip: "text", WebkitTextFillColor: "transparent" }}>Knockout Stage</h2>
        <div style={{ fontSize: 10, color: "#334455", marginTop: 3 }}>Seeded so players avoid their own teams until the final</div>
      </div>

      {bracket.winner && (
        <div style={{ background: "rgba(201,168,76,0.1)", border: "2px solid #c9a84c", margin: "14px", borderRadius: 10, padding: "14px", textAlign: "center" }}>
          <div style={{ fontSize: 28 }}>🏆</div>
          <div style={{ fontSize: 10, letterSpacing: 3, color: "#c9a84c", marginBottom: 3 }}>TOURNAMENT WINNER</div>
          <div style={{ fontSize: 22, fontWeight: 700 }}>{bracket.winner.flag} {bracket.winner.name}</div>
          <div style={{ fontSize: 13, color: PLAYER_COLORS[bracket.winner.playerIdx], marginTop: 3 }}>{players[bracket.winner.playerIdx]}</div>
        </div>
      )}

      <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fit, minmax(190px, 1fr))", gap: 12, padding: "14px" }}>
        {/* Self-match resolution banner — shown when Player X has two teams in the same match */}
        {selfMatchQueue.length > 0 && (() => {
          const { smKey, round, matchIdx, teamA, teamB, replacement } = selfMatchQueue[0];
          const rLabel = { qf: "Quarter-Finals", sf: "Semi-Finals", final: "Final" }[round];
          return (
            <div style={{ gridColumn: "1 / -1", background: "rgba(239,68,68,0.07)", border: "2px solid #ef444466", borderRadius: 10, padding: "16px", marginBottom: 4 }}>
              <div style={{ fontSize: 11, letterSpacing: 2, color: "#ef4444", marginBottom: 8, textTransform: "uppercase" }}>⚠️ Self-match detected — {rLabel}</div>
              <div style={{ fontSize: 13, color: "#aabbcc", marginBottom: 12 }}>
                <strong style={{ color: PLAYER_COLORS[teamA.playerIdx] }}>{players[teamA.playerIdx]}</strong> has two teams in the same {rLabel} match. Pick which one continues:
              </div>
              <div style={{ display: "flex", gap: 10, marginBottom: 14, flexWrap: "wrap" }}>
                {[teamA, teamB].map(t => (
                  <button key={t.name} onClick={() => resolveSelfMatch(smKey, round, matchIdx, t)} style={{
                    flex: 1, minWidth: 120, padding: "10px 12px", borderRadius: 7, cursor: "pointer",
                    background: "transparent", border: `2px solid ${PLAYER_COLORS[t.playerIdx]}88`,
                    color: "#e8e0d0", fontFamily: "inherit", fontSize: 13, fontWeight: 700,
                    transition: "background 0.15s",
                  }}>
                    {t.flag} {t.name}
                  </button>
                ))}
              </div>
              {replacement && (
                <div style={{ fontSize: 12, color: "#667788", borderTop: "1px solid #1e2533", paddingTop: 10 }}>
                  The dropped slot will be filled by <strong style={{ color: "#aabbcc" }}>{replacement.flag} {replacement.name}</strong>
                  <span style={{ color: PLAYER_COLORS[replacement.playerIdx] }}> ({players[replacement.playerIdx]})</span> — they had the best result from the previous round.
                </div>
              )}
            </div>
          );
        })()}
        {rounds.map(({ key, label, pairs }) => (
          <div key={key}>
            <div style={{ fontSize: 10, letterSpacing: 3, color: "#c9a84c", marginBottom: 10, textTransform: "uppercase", textAlign: "center" }}>{label}</div>
            {pairs.map(([idx, tA, tB]) => renderMatch(key, idx, tA, tB))}
          </div>
        ))}
      </div>
    </div>
  );
}

// ─── ROOT ────────────────────────────────────────────────────────
// ─── REAL GROUPS SETUP ────────────────────────────────────────────
function RealGroupsSetup({ onStart, onAutoPlay, onBack, initialDraftState, onDraftStateChange }) {
  const [players, setPlayers] = useState(initialDraftState?.players || DEFAULT_PLAYERS);
  const [claims, setClaims] = useState(initialDraftState?.claims || {});
  const [pickOrderIdx, setPickOrderIdx] = useState(initialDraftState?.pickOrderIdx || 0);
  const [autoNotice, setAutoNotice] = useState(null); // { playerName, team, group }
  const [tab, setTab] = useState(initialDraftState ? "draft" : "players");
  const [timeLeft, setTimeLeft] = useState(60);     // seconds per pick
  const PICK_SECONDS = 60;

  const groupKeys = Object.keys(WC_GROUPS);
  const isDraftDone = pickOrderIdx >= PICK_ORDER_REAL.length;
  const currentPickerIdx = isDraftDone ? null : PICK_ORDER_REAL[pickOrderIdx];
  const nextPickerIdx = isDraftDone ? null : PICK_ORDER_REAL[pickOrderIdx + 1] ?? null;
  const currentRoundLabel = isDraftDone ? "" : (ROUND_LABELS_REAL.find(([s,e]) => pickOrderIdx >= s && pickOrderIdx <= e)?.[2] ?? "");

  // ── Draft helpers ──────────────────────────────────────────────
  const groupPickCount = (claimsObj) => {
    const c = Object.fromEntries(groupKeys.map(g => [g, 0]));
    for (const t of Object.keys(claimsObj)) c[TEAM_GROUP[t]]++;
    return c;
  };
  const playerGroupSet = (claimsObj, pidx) => {
    const s = new Set();
    for (const [t, owner] of Object.entries(claimsObj)) if (owner === pidx) s.add(TEAM_GROUP[t]);
    return s;
  };
  const validGroupsFor = (claimsObj, pidx) => {
    const gpc = groupPickCount(claimsObj), pg = playerGroupSet(claimsObj, pidx);
    return groupKeys.filter(gk => !pg.has(gk) && gpc[gk] < 3 && WC_GROUPS[gk].some(t => !claimsObj[t]));
  };
  const mostConstrainedGroup = (claimsObj, futurePickers) => {
    const gpc = groupPickCount(claimsObj);
    let best = null, bestElig = Infinity;
    for (const gk of groupKeys) {
      if (gpc[gk] >= 3 || !WC_GROUPS[gk].some(t => !claimsObj[t])) continue;
      const elig = new Set(futurePickers.filter(p => !playerGroupSet(claimsObj, p).has(gk))).size;
      if (elig < bestElig) { bestElig = elig; best = gk; }
    }
    return best;
  };
  const bestTeamIn = (gk, claimsObj) => {
    const un = WC_GROUPS[gk].filter(t => !claimsObj[t]);
    if (!un.length) return null;
    return un.reduce((b, t) => teamByName[t].tier < teamByName[b].tier ? t : b);
  };

  // ── Pick timer ─────────────────────────────────────────────────
  // Counts down from PICK_SECONDS. On expiry, assigns a random valid team.
  // Resets whenever pickOrderIdx or tab changes (new turn or entering draft tab).
  useEffect(() => {
    if (isDraftDone || tab !== "draft") return;
    setTimeLeft(PICK_SECONDS);
    const interval = setInterval(() => {
      setTimeLeft(prev => {
        if (prev <= 1) {
          clearInterval(interval);
          // Time expired — pick a random valid team for the current player
          setClaims(currentClaims => {
            const pidx = PICK_ORDER_REAL[pickOrderIdx];
            const isRound1 = pickOrderIdx < 9;
            // Collect all valid pickable teams
            const valid = [];
            for (const gk of Object.keys(WC_GROUPS)) {
              if (playerGroupSet(currentClaims, pidx).has(gk)) continue;
              const gpc = groupPickCount(currentClaims);
              if (gpc[gk] >= 3) continue;
              for (const t of WC_GROUPS[gk]) {
                if (!currentClaims[t] && !(isRound1 && teamByName[t]?.tier === 1)) {
                  valid.push({ t, gk });
                }
              }
            }
            if (!valid.length) return currentClaims; // fallback: nothing to pick
            const { t, gk } = valid[Math.floor(Math.random() * valid.length)];
            // Reuse same chain logic as handleClaim (inline to avoid stale closure)
            let newClaims = { ...currentClaims, [t]: pidx };
            let newIdx = pickOrderIdx + 1;
            let notice = { playerName: players[pidx], team: t, group: gk, timedOut: true };
            while (newIdx < PICK_ORDER_REAL.length) {
              const nextP = PICK_ORDER_REAL[newIdx];
              if (validGroupsFor(newClaims, nextP).length > 0) break;
              const futurePickers = PICK_ORDER_REAL.slice(newIdx + 1);
              const autoGk = mostConstrainedGroup(newClaims, [nextP, ...futurePickers]);
              if (!autoGk) break;
              const autoTeam = bestTeamIn(autoGk, newClaims);
              if (!autoTeam) break;
              newClaims = { ...newClaims, [autoTeam]: nextP };
              notice = { playerName: players[nextP], team: autoTeam, group: autoGk };
              newIdx++;
            }
            setPickOrderIdx(newIdx);
            setAutoNotice(notice);
            onDraftStateChange && onDraftStateChange({ players, claims: newClaims, pickOrderIdx: newIdx });
            return newClaims;
          });
          return 0;
        }
        return prev - 1;
      });
    }, 1000);
    return () => clearInterval(interval);
  }, [pickOrderIdx, tab]);

  const handleClaim = (tname) => {
    if (isDraftDone || currentPickerIdx === null) return;
    const gk = TEAM_GROUP[tname];
    if (claims[tname] !== undefined) return;
    if (pickOrderIdx < 9 && teamByName[tname]?.tier === 1) return; // elites locked in round 1
    if (!validGroupsFor(claims, currentPickerIdx).includes(gk)) return;

    // Apply this pick, then auto-assign any subsequent players with no valid move
    let newClaims = { ...claims, [tname]: currentPickerIdx };
    let newIdx = pickOrderIdx + 1;
    let notice = null;

    while (newIdx < PICK_ORDER_REAL.length) {
      const nextP = PICK_ORDER_REAL[newIdx];
      if (validGroupsFor(newClaims, nextP).length > 0) break;
      const futurePickers = PICK_ORDER_REAL.slice(newIdx + 1);
      const autoGk = mostConstrainedGroup(newClaims, [nextP, ...futurePickers]);
      if (!autoGk) break;
      const autoTeam = bestTeamIn(autoGk, newClaims);
      if (!autoTeam) break;
      newClaims = { ...newClaims, [autoTeam]: nextP };
      notice = { playerName: players[nextP], team: autoTeam, group: autoGk };
      newIdx++;
    }

    setClaims(newClaims);
    setPickOrderIdx(newIdx);
    setAutoNotice(notice);
    onDraftStateChange && onDraftStateChange({ players, claims: newClaims, pickOrderIdx: newIdx });
  };

  const handleStart = () => {
    const groups = {};
    groupKeys.forEach(gk => {
      groups[gk] = WC_GROUPS[gk].filter(t => claims[t] !== undefined).map(t => ({ ...teamByName[t], playerIdx: claims[t] }));
    });
    const selectedTeams = [];
    Object.entries(groups).forEach(([letter, ts]) => ts.forEach(t => selectedTeams.push({ ...t, group: letter })));
    onStart({ players, selectedTeams, groups });
  };

  return (
    <div style={{ minHeight: "100vh", background: "#0f1117", color: "#e8e0d0", fontFamily: "Georgia, serif" }}>
      <style>{`.rg-grid{display:grid;gap:12px;grid-template-columns:repeat(2,1fr);}@media(min-width:600px){.rg-grid{grid-template-columns:repeat(3,1fr);}}@media(min-width:1024px){.rg-grid{grid-template-columns:repeat(6,1fr);}}`}</style>
      <div style={{ background: "linear-gradient(135deg,#1a1f2e,#0f1117)", borderBottom: "2px solid #c9a84c", padding: "16px 20px 12px", textAlign: "center", position: "relative" }}>
        <button onClick={onBack} style={{ position: "absolute", left: 12, top: 14, background: "none", border: "none", color: "#667788", cursor: "pointer", fontFamily: "inherit", fontSize: 12 }}>← Modes</button>
        <div style={{ fontSize: 11, letterSpacing: 5, color: "#c9a84c", marginBottom: 3 }}>FC TOURNAMENT</div>
        <h1 style={{ margin: 0, fontSize: 22, background: "linear-gradient(90deg,#c9a84c,#f5e1a4,#c9a84c)", WebkitBackgroundClip: "text", WebkitTextFillColor: "transparent" }}>Real World Cup Groups</h1>
        <div style={{ fontSize: 10, color: "#445566", marginTop: 3, letterSpacing: 2 }}>DRAFT 3 TEAMS PER GROUP · 4TH IS DROPPED</div>
      </div>

      <div style={{ display: "flex", borderBottom: "1px solid #1e2533", background: "#0d1017" }}>
        {[["players", "👥 Players"], ["draft", "🌍 Draft"]].map(([key, label]) => (
          <button key={key} onClick={() => setTab(key)} style={{ flex: 1, padding: "11px 8px", border: "none", cursor: "pointer", fontFamily: "inherit", fontSize: 11, letterSpacing: 2, textTransform: "uppercase", background: tab === key ? "#1a2030" : "transparent", color: tab === key ? "#c9a84c" : "#445566", borderBottom: tab === key ? "2px solid #c9a84c" : "2px solid transparent" }}>{label}</button>
        ))}
      </div>

      {tab === "players" && (
        <div style={{ padding: "24px 20px" }}>
          <p style={{ color: "#556677", fontSize: 15, textAlign: "center", margin: "0 0 18px", letterSpacing: 1 }}>Enter names in seed order (1 = strongest). Handicap: seeds 1–3 draft 3 teams, 4–6 draft 4, 7–9 draft 5.</p>
          <div style={{ display: "grid", gridTemplateColumns: "1fr", gap: 10, maxWidth: 540, margin: "0 auto 24px" }}>
            {players.map((p, i) => {
              const cnt = Object.values(claims).filter(x => x === i).length;
              return (
                <div key={i} style={{ display: "flex", alignItems: "center", gap: 10, background: "#131820", border: `1px solid ${PLAYER_COLORS[i]}44`, borderRadius: 8, padding: "10px 14px" }}>
                  <span style={{ fontSize: 14, color: "#556677", fontWeight: 700, minWidth: 20 }}>{i + 1}</span>
                  <div style={{ width: 13, height: 13, borderRadius: "50%", background: PLAYER_COLORS[i], flexShrink: 0 }} />
                  <input value={p} onChange={e => setPlayers(prev => prev.map((x, j) => j === i ? e.target.value : x))} style={{ flex: 1, background: "transparent", border: "none", outline: "none", color: "#e8e0d0", fontFamily: "inherit", fontSize: 16 }} />
                  <span style={{ fontSize: 13, color: cnt === teamQuota(i, players.length) ? "#22c55e" : PLAYER_COLORS[i], fontWeight: 700, minWidth: 38, textAlign: "right" }}>{cnt}/{teamQuota(i, players.length)}</span>
                </div>
              );
            })}
          </div>
          <div style={{ textAlign: "center" }}>
            <button onClick={() => setTab("draft")} style={{ background: "#c9a84c", color: "#0f1117", border: "none", borderRadius: 6, padding: "12px 32px", fontFamily: "inherit", fontSize: 14, fontWeight: 700, cursor: "pointer", letterSpacing: 2 }}>NEXT: DRAFT →</button>
            <div style={{ marginTop: 16 }}>
              <button onClick={() => onAutoPlay(players)} style={{ background: "transparent", color: "#c9a84c", border: "1px solid #c9a84c66", borderRadius: 6, padding: "11px 28px", fontFamily: "inherit", fontSize: 14, fontWeight: 700, cursor: "pointer", letterSpacing: 2 }}>⚡ AUTO-PLAY (QUICK SIM)</button>
              <div style={{ fontSize: 12, color: "#445566", marginTop: 6 }}>Auto-drafts the real groups & simulates everything</div>
            </div>
          </div>
        </div>
      )}

      {tab === "draft" && (
        <div style={{ padding: "16px 16px 100px" }}>

          {/* Pick counter + round label */}
          <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 10 }}>
            <span style={{ fontSize: 12, color: "#445566", letterSpacing: 1 }}>{currentRoundLabel}</span>
            <span style={{ fontSize: 12, color: isDraftDone ? "#22c55e" : "#c9a84c" }}>
              {isDraftDone ? "✅ Draft complete" : `Pick ${pickOrderIdx + 1} of ${PICK_ORDER_REAL.length}`}
            </span>
          </div>

          {/* Current / next picker bar */}
          {!isDraftDone && currentPickerIdx !== null && (
            <div style={{ background: "#131820", border: `2px solid ${PLAYER_COLORS[currentPickerIdx]}66`, borderRadius: 10, padding: "12px 16px", marginBottom: 10, display: "flex", alignItems: "center", justifyContent: "space-between", gap: 12 }}>
              <div style={{ display: "flex", alignItems: "center", gap: 10 }}>
                <div style={{ width: 13, height: 13, borderRadius: "50%", background: PLAYER_COLORS[currentPickerIdx], flexShrink: 0 }} />
                <div>
                  <div style={{ fontSize: 11, color: "#556677", letterSpacing: 1 }}>NOW PICKING</div>
                  <div style={{ fontSize: 16, color: PLAYER_COLORS[currentPickerIdx], fontWeight: 700 }}>{players[currentPickerIdx]}</div>
                </div>
              </div>
              <div style={{ display: "flex", alignItems: "center", gap: 16 }}>
                {/* Timer */}
                <div style={{ textAlign: "center" }}>
                  <div style={{ fontSize: 22, fontWeight: 700, color: timeLeft <= 20 ? "#ef4444" : timeLeft <= 60 ? "#f97316" : "#22c55e", fontVariantNumeric: "tabular-nums", lineHeight: 1 }}>
                    {String(Math.floor(timeLeft / 60)).padStart(2,"0")}:{String(timeLeft % 60).padStart(2,"0")}
                  </div>
                  <div style={{ fontSize: 9, color: "#445566", letterSpacing: 1, marginTop: 2 }}>
                    {timeLeft <= 20 ? "HURRY UP!" : "REMAINING"}
                  </div>
                </div>
                {nextPickerIdx !== null && (
                  <div style={{ textAlign: "right" }}>
                    <div style={{ fontSize: 10, color: "#445566", letterSpacing: 1 }}>NEXT</div>
                    <div style={{ fontSize: 13, color: PLAYER_COLORS[nextPickerIdx] }}>{players[nextPickerIdx].split(" ")[0]}</div>
                  </div>
                )}
              </div>
            </div>
          )}

          {/* Auto-assign notice */}
          {autoNotice && (
            <div style={{ background: "rgba(234,179,8,0.08)", border: "1px solid #eab30844", borderRadius: 8, padding: "9px 13px", marginBottom: 10, fontSize: 13, color: "#eab308" }}>
              {autoNotice.timedOut
                ? `⏱ Time expired: `
                : `⚡ Auto-assigned: `}
              <strong>{autoNotice.playerName.split(" ")[0]}</strong> received {teamByName[autoNotice.team]?.flag} {autoNotice.team} (Group {autoNotice.group})
              {autoNotice.timedOut ? " — ran out of time." : " — no valid group was available."}
            </div>
          )}

          {/* Groups grid */}
          <div className="rg-grid">
            {groupKeys.map(gk => {
              const gpc = groupPickCount(claims);
              const full = gpc[gk] >= 3;
              const currentPlayerInGroup = currentPickerIdx !== null && playerGroupSet(claims, currentPickerIdx).has(gk);
              const isAvailableGroup = !isDraftDone && !full && !currentPlayerInGroup;
              const headerColor = full ? "#334455" : isAvailableGroup ? "#c9a84c" : "#445566";
              return (
                <div key={gk} style={{ background: "#10141c", border: `1px solid ${full ? "#1a2030" : isAvailableGroup ? "#c9a84c33" : "#1e2533"}`, borderRadius: 8, overflow: "hidden", opacity: full ? 0.6 : 1 }}>
                  <div style={{ background: full ? "#141820" : "#1a2030", padding: "8px 12px", fontSize: 15, fontWeight: 700, color: headerColor, letterSpacing: 1, display: "flex", justifyContent: "space-between", alignItems: "center" }}>
                    <span>Group {gk}</span>
                    {full && <span style={{ fontSize: 10, color: "#334455", letterSpacing: 1 }}>FULL</span>}
                    {currentPlayerInGroup && !full && <span style={{ fontSize: 10, color: "#556677", letterSpacing: 1 }}>YOURS</span>}
                  </div>
                  <div style={{ padding: 8, display: "flex", flexDirection: "column", gap: 6 }}>
                    {WC_GROUPS[gk].map(tname => {
                      const t = teamByName[tname];
                      const owner = claims[tname];
                      const isClaimed = owner !== undefined;
                      const isDropped = !isClaimed && full;
                      const isEliteLocked = pickOrderIdx < 9 && t.tier === 1 && !isClaimed;
                      const isPickable = isAvailableGroup && !isClaimed && !isDraftDone && !isEliteLocked;
                      const aColor = isClaimed ? PLAYER_COLORS[owner] : null;
                      return (
                        <button key={tname} onClick={() => handleClaim(tname)} style={{
                          display: "flex", alignItems: "center", gap: 6, width: "100%", textAlign: "left",
                          padding: "8px 9px", borderRadius: 4,
                          cursor: isPickable ? "pointer" : "default",
                          border: `1px solid ${isClaimed ? aColor + "99" : isDropped ? "#1a2030" : isEliteLocked ? "#f5c84233" : isPickable ? "#3a4a5a" : "#2a3545"}`,
                          background: isClaimed ? aColor + "28" : isDropped ? "#0d1017" : isEliteLocked ? "#1a1608" : "#131820",
                          color: isDropped ? "#2a3040" : isClaimed ? aColor : isEliteLocked ? "#6b5a20" : isPickable ? "#8899aa" : "#556677",
                          fontSize: 14, fontFamily: "inherit", lineHeight: 1.25,
                          textDecoration: isDropped ? "line-through" : "none",
                        }}>
                          <span style={{ width: 8, height: 8, borderRadius: "50%", background: TIER_COLOR[t.tier], flexShrink: 0, opacity: isDropped ? 0.2 : 1 }} />
                          <span style={{ flex: 1, minWidth: 0 }}>{t.flag} {t.name}</span>
                          {isEliteLocked && <span style={{ fontSize: 10, color: "#6b5a20" }}>🔒</span>}
                          {isClaimed && <span style={{ fontSize: 11, opacity: 0.85 }}>{players[owner].split(" ")[0]}</span>}
                        </button>
                      );
                    })}
                  </div>
                </div>
              );
            })}
          </div>
        </div>
      )}

      {tab === "draft" && (
        <div style={{ position: "fixed", bottom: 0, left: 0, right: 0, background: "linear-gradient(transparent, #0f1117 35%)", padding: "16px", display: "flex", flexDirection: "column", alignItems: "center", gap: 5 }}>
          {!isDraftDone && <div style={{ fontSize: 13, color: "#556677" }}>{PICK_ORDER_REAL.length - pickOrderIdx} pick{PICK_ORDER_REAL.length - pickOrderIdx !== 1 ? "s" : ""} remaining</div>}
          <button onClick={isDraftDone ? handleStart : undefined} style={{ background: isDraftDone ? "linear-gradient(135deg,#c9a84c,#f5e1a4)" : "#1a2030", color: isDraftDone ? "#0f1117" : "#334455", border: isDraftDone ? "none" : "1px solid #2a3040", borderRadius: 8, padding: "12px 40px", fontFamily: "inherit", fontSize: 13, fontWeight: 700, cursor: isDraftDone ? "pointer" : "not-allowed", letterSpacing: 3 }}>
            {isDraftDone ? "🏆 START TOURNAMENT" : "⏳ COMPLETE THE DRAFT"}
          </button>
        </div>
      )}
    </div>
  );
}

// ─── MODE MENU ────────────────────────────────────────────────────
function ModeMenu({ onPick, onLoadFile }) {
  const card = (mode, title, desc) => (
    <button onClick={() => onPick(mode)} style={{
      display: "block", width: "100%", textAlign: "left", cursor: "pointer",
      background: "#131820", border: "1px solid #2a3545", borderRadius: 10, padding: "16px 18px", marginBottom: 12,
      fontFamily: "inherit", color: "#e8e0d0",
    }}>
      <div style={{ fontSize: 16, fontWeight: 700, color: "#c9a84c", marginBottom: 4 }}>{title}</div>
      <div style={{ fontSize: 12, color: "#8899aa", lineHeight: 1.5 }}>{desc}</div>
    </button>
  );
  return (
    <div style={{ minHeight: "100vh", background: "#0f1117", color: "#e8e0d0", fontFamily: "Georgia, serif" }}>
      <div style={{ background: "linear-gradient(135deg,#1a1f2e,#0f1117)", borderBottom: "2px solid #c9a84c", padding: "24px 20px 18px", textAlign: "center" }}>
        <div style={{ fontSize: 11, letterSpacing: 5, color: "#c9a84c", marginBottom: 4 }}>FC TOURNAMENT</div>
        <h1 style={{ margin: 0, fontSize: 26, background: "linear-gradient(90deg,#c9a84c,#f5e1a4,#c9a84c)", WebkitBackgroundClip: "text", WebkitTextFillColor: "transparent" }}>World Cup 2026 Edition</h1>
        <div style={{ fontSize: 11, color: "#556677", marginTop: 6, letterSpacing: 2 }}>CHOOSE A MODE</div>
      </div>
      <div style={{ padding: "24px 16px", maxWidth: 520, margin: "0 auto" }}>
        {card("custom", "⚖️  Custom Balanced Groups", "The app builds 12 balanced groups of 3 — even strength, elites spread out, top-3 players kept apart. Maximum fairness.")}
        {card("real", "🌍  Real World Cup Groups", "Use the actual World Cup groups. Players draft 3 teams from each real group; the 4th is dropped. Authentic, but no balancing.")}
        <label style={{ display: "block", textAlign: "center", cursor: "pointer", marginTop: 12 }}>
          <span style={{ fontSize: 12, color: "#556677", letterSpacing: 1 }}>📂 Load saved game</span>
          <input type="file" accept=".json" style={{ display: "none" }} onChange={onLoadFile} />
        </label>
        <div style={{ fontSize: 11, color: "#445566", textAlign: "center", marginTop: 14, lineHeight: 1.6 }}>Both modes: 9 players · 36 teams · 12 groups of 3 · 51 games · same seeded knockout.</div>
      </div>
    </div>
  );
}

// ─── ROOT ────────────────────────────────────────────────────────
function App() {
  const [phase, setPhase] = useState("menu");
  const [mode, setMode] = useState("custom");
  const [tournament, setTournament] = useState(null);
  const [advancedTeams, setAdvancedTeams] = useState(null);
  const [sim, setSim] = useState(null);
  const [liveGroupState, setLiveGroupState] = useState(null);
  const [liveKoState, setLiveKoState] = useState(null);
  const [liveDraftState, setLiveDraftState] = useState(null);
  const [syncStatus, setSyncStatus] = useState("idle");
  const [lastSyncAt, setLastSyncAt] = useState(null);

  const buildSnapshot = () => ({
    version: 1, mode, phase, tournament, advancedTeams,
    groupScores:  liveGroupState?.groupScores ?? sim?.groupScores,
    groupPlayed:  liveGroupState?.groupPlayed ?? sim?.groupPlayed,
    koBracket:    liveKoState?.koBracket      ?? sim?.koBracket,
    koScores:     liveKoState?.koScores       ?? sim?.koScores,
    koConfirmed:  liveKoState?.koConfirmed    ?? sim?.koConfirmed,
    draftState:   liveDraftState,
  });

  const restoreSnapshot = (snap) => {
    if (!snap) return;
    setMode(snap.mode || "custom");
    setTournament(snap.tournament || null);
    setAdvancedTeams(snap.advancedTeams || null);
    setSim({ groupScores: snap.groupScores, groupPlayed: snap.groupPlayed, koBracket: snap.koBracket, koScores: snap.koScores, koConfirmed: snap.koConfirmed });
    setLiveGroupState(snap.groupScores ? { groupScores: snap.groupScores, groupPlayed: snap.groupPlayed } : null);
    setLiveKoState(snap.koBracket ? { koBracket: snap.koBracket, koScores: snap.koScores, koConfirmed: snap.koConfirmed } : null);
    setLiveDraftState(snap.draftState || null);
    setPhase(snap.phase || "menu");
  };

  // Load from JSONBin on mount (everyone)
  useEffect(() => {
    if (!TOKEN_SET) return;
    setSyncStatus("loading");
    syncLoad()
      .then(snap => { if (snap?.version) restoreSnapshot(snap); setSyncStatus("ok"); setLastSyncAt(new Date()); })
      .catch(() => setSyncStatus("error"));
  }, []);

  // Auto-load every 30s — non-hosts only
  useEffect(() => {
    if (!TOKEN_SET || IS_HOST) return;
    const id = setInterval(() => {
      setSyncStatus("loading");
      syncLoad()
        .then(snap => { if (snap?.version) restoreSnapshot(snap); setSyncStatus("ok"); setLastSyncAt(new Date()); })
        .catch(() => setSyncStatus("error"));
    }, 30000);
    return () => clearInterval(id);
  }, []);

  const handleLoadFile = (e) => {
    const file = e.target.files?.[0]; if (!file) return;
    const reader = new FileReader();
    reader.onload = (ev) => { try { restoreSnapshot(JSON.parse(ev.target.result)); } catch { alert("Invalid save file."); } };
    reader.readAsText(file);
    e.target.value = "";
  };

  const handleSave = () => {
    const snap = buildSnapshot();
    if (!TOKEN_SET) { alert("Sync not configured."); return; }
    setSyncStatus("saving");
    syncSave(snap)
      .then(() => { setSyncStatus("ok"); setLastSyncAt(new Date()); })
      .catch(() => { setSyncStatus("error"); alert("Sync failed — check your connection."); });
  };

  const handleReset = () => {
    if (!window.confirm("Reset everything and start over? This will clear the shared data too.")) return;
    setPhase("menu"); setMode("custom"); setTournament(null);
    setAdvancedTeams(null); setSim(null);
    setLiveGroupState(null); setLiveKoState(null); setLiveDraftState(null);
    setSyncStatus("idle"); setLastSyncAt(null);
    if (TOKEN_SET) syncSave({}).then(() => {}).catch(() => {});
  };

  const startTournament = ({ players, selectedTeams, groups }) => {
    setSim(null); setLiveGroupState(null); setLiveKoState(null); setLiveDraftState(null);
    setTournament({ players, selectedTeams, groups });
    setPhase("groups");
  };

  const handleAutoPlay = (players) => {
    let groups = null;
    if (mode === "real") {
      for (let i = 0; i < 10 && !groups; i++) {
        const claims = autoDraftRealGroups(players);
        if (!claims) continue;
        groups = {};
        Object.keys(WC_GROUPS).forEach(gk => {
          groups[gk] = WC_GROUPS[gk].filter(t => claims[t] !== undefined).map(t => ({ ...teamByName[t], playerIdx: claims[t] }));
        });
      }
    } else {
      for (let i = 0; i < 20 && !groups; i++) {
        groups = buildFairGroups(autoAssignTeams(players));
      }
    }
    if (!groups) { alert("Couldn't build groups — please try again."); return; }
    const selectedTeams = [];
    Object.entries(groups).forEach(([letter, gTeams]) => gTeams.forEach(t => selectedTeams.push({ ...t, group: letter })));
    const result = simulateTournament(groups, mode === "real" ? seedFixedBracket : seedKnockout);
    setTournament({ players, selectedTeams, groups });
    setAdvancedTeams(result.advancedTeams);
    setSim(result);
    setLiveGroupState(null); setLiveKoState(null); setLiveDraftState(null);
    setPhase("groups");
  };

  const syncBadge = (
    <div style={{ position: "fixed", top: 10, right: 12, zIndex: 9999, display: "flex", gap: 6 }}>
      <button onClick={handleReset} style={{
        background: "#ffffff", border: "2px solid #cc3333", borderRadius: 8,
        padding: "6px 12px", fontSize: 12, color: "#cc3333",
        boxShadow: "0 2px 8px rgba(0,0,0,0.15)", fontFamily: "Georgia, serif", cursor: "pointer",
      }}>🗑 Reset</button>
      <button onClick={handleSave} disabled={!TOKEN_SET || syncStatus === "saving"} style={{
        background: "#ffffff",
        border: `2px solid ${!TOKEN_SET ? "#cccccc" : syncStatus === "error" ? "#cc3333" : syncStatus === "saving" ? "#b8913a" : syncStatus === "ok" ? "#22a060" : "#b8913a"}`,
        borderRadius: 8, padding: "6px 14px", fontSize: 12, display: "flex", alignItems: "center", gap: 6,
        color: !TOKEN_SET ? "#aaaaaa" : syncStatus === "error" ? "#cc3333" : syncStatus === "saving" ? "#b8913a" : syncStatus === "ok" ? "#22a060" : "#b8913a",
        boxShadow: "0 2px 8px rgba(0,0,0,0.15)", fontFamily: "Georgia, serif",
        cursor: !TOKEN_SET || syncStatus === "saving" ? "default" : "pointer",
      }}>
        {!TOKEN_SET ? "⚪ Sync off" : syncStatus === "saving" ? "📤 Saving..." : syncStatus === "error" ? "❌ Retry save" : syncStatus === "ok" ? `✅ Saved ${lastSyncAt ? lastSyncAt.toLocaleTimeString([],{hour:"2-digit",minute:"2-digit"}) : ""}` : "💾 Save"}
      </button>
    </div>
  );

  const floatSave = null;

  if (phase === "menu") return (
    <>{syncBadge}<ModeMenu onPick={m => { setMode(m); setPhase("setup"); }} onLoadFile={handleLoadFile} /></>
  );
  if (phase === "setup") return (
    <>
      {syncBadge}
      {mode === "real"
        ? <RealGroupsSetup
            onStart={startTournament} onAutoPlay={handleAutoPlay} onBack={() => setPhase("menu")}
            initialDraftState={liveDraftState} onDraftStateChange={setLiveDraftState}
          />
        : <SetupPhase onStart={startTournament} onAutoPlay={handleAutoPlay} />}
    </>
  );
  if (phase === "groups") return (
    <>
      {syncBadge}
      <GroupStage
        players={tournament.players} selectedTeams={tournament.selectedTeams} groups={tournament.groups}
        initialScores={liveGroupState?.groupScores ?? sim?.groupScores}
        initialPlayed={liveGroupState?.groupPlayed ?? sim?.groupPlayed}
        onAdvance={t => { setAdvancedTeams(t); setPhase("knockout"); }}
        onStateChange={setLiveGroupState}
      />
      {floatSave}
    </>
  );
  if (phase === "knockout") return (
    <>
      {syncBadge}
      <KnockoutStage
        players={tournament.players} advancedTeams={advancedTeams}
        initialBracket={liveKoState?.koBracket ?? sim?.koBracket}
        initialScores={liveKoState?.koScores   ?? sim?.koScores}
        initialConfirmed={liveKoState?.koConfirmed ?? sim?.koConfirmed}
        seedFn={mode === "real" ? seedFixedBracket : seedKnockout}
        onStateChange={setLiveKoState}
      />
      {floatSave}
    </>
  );
}

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
